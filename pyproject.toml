[project]
name = "calc"
version = "0.1.0"
description = "Minimal Spreadsheet Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anywidget",
    "marimo>=0.23.16",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "rich>=15.0.0",
    "scan-google-sheet>=0.1.1",
    "traitlets>=5.16.1",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.src]
# vision.py/notebook.py are marimo apps: marimo runs them standalone
# from within src/, so their `from engine import ...` is a sibling
# import that only resolves when src/ itself is on sys.path — a
# different (and incompatible) module-resolution root than the rest
# of the project, which imports the package as `src.engine`. Rather
# than adding src/ as an extra-paths root (which makes ty resolve
# src/__init__.py's own `from .engine import` ambiguously), exclude
# these two notebook entry points from type checking.
exclude = ["src/vision.py", "src/notebook.py"]
