[project]
name = "calc"
version = "0.1.0"
description = "Minimal Spreadsheet Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.23.16",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
